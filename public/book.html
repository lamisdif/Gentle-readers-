  <style>
    .button {
      height: 60px;
      width: 200px;
      background-color: #132233;
      border: 2px solid rgb(182, 128, 128);
      color: #eee;
      transition: .6s;
      font-size: 15px;
      border-radius: 50px;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .button span {
      transform: translateX(10px);
      transition: .5s;
    }

    .button svg {
      transform: translateX(-300px);
      transition: .6s;
      z-index: 3;
      height: 20px;
    }

    .button:hover {
      width: 60px;
      background-color: rgba(51, 34, 51, 0.815);
      box-shadow: 20px 20px 96px #bebebe, -20px -20px 96px #ffffff;
    }

    .button:hover svg {
      transform: translateX(-5px);
    }

    .button:hover span {
      transform: translateY(70px);
      font-size: .1rem;
    }

    /* Cart Icon Styles */
    .btn-cart {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 50px;
      height: 50px;
      border-radius: 10px;
      border: none;
      background-color: transparent;
      position: relative;
      cursor: pointer;
    }

    .btn-cart::after {
      content: attr(data-quantity);
      width: fit-content;
      height: fit-content;
      position: absolute;
      font-size: 15px;
      color: white;
      font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
      opacity: 0;
      visibility: hidden;
      transition: .2s linear;
      top: 115%;
    }

    .icon-cart {
      width: 24.38px;
      height: 30.52px;
      transition: .2s linear;
    }

    .icon-cart path {
      fill: rgb(240, 8, 8);
      transition: .2s linear;
    }

    .btn-cart:hover > .icon-cart {
      transform: scale(1.2);
    }

    .btn-cart:hover > .icon-cart path {
      fill: rgb(186, 34, 233);
    }

    .btn-cart:hover::after {
      visibility: visible;
      opacity: 1;
      top: 105%;
    }

    .quantity {
      display: none;
    }
  </style>
</head>

    const params = new URLSearchParams(window.location.search);
    const id = params.get("id");
    const book = books[id];

    if (book) {
      document.getElementById("book-title").textContent = book.title;
      document.getElementById("book-author").textContent = "Author: " + book.author;
      // Show Arabic description if language is 'ar', otherwise show English
      const lang = localStorage.getItem('lang') || 'en';
      document.getElementById("book-description").textContent =
        lang === 'ar' && book.description_ar ? book.description_ar : book.description;
      document.getElementById("book-image").src = book.cover;
      
      // Check if book is out of stock and update UI accordingly
      const outOfStockBooks = ['la_yumkinuka_iidhaayi', 'the_hunger_games'];
      if (outOfStockBooks.includes(id)) {
        const button = document.querySelector('.button');
        button.disabled = true;
        button.style.backgroundColor = '#dc2626';
        button.style.cursor = 'not-allowed';
        button.style.opacity = '0.7';
        button.innerHTML = '<span>Out of Stock / نفدت الكمية</span>';
        
        // Add out of stock notice
        const notice = document.createElement('p');
        notice.style.color = '#dc2626';
        notice.style.fontWeight = 'bold';
        notice.style.textAlign = 'center';
        notice.style.margin = '10px 0';
        notice.textContent = 'This book is currently out of stock / هذا الكتاب نفدت الكمية حالياً';
        button.parentNode.insertBefore(notice, button);
      }
    } else {
      document.body.innerHTML = "<p class='text-red-600 text-xl text-center'>Book not found.</p>";
    }

    // Update cart counter on page load
    function updateCartCounter() {
      const stored = JSON.parse(localStorage.getItem('cart')) || {};
      const cartButtons = document.querySelectorAll('.btn-cart');
      const totalQty = Array.isArray(stored) ? stored.length : Object.values(stored).reduce((a,b)=>a+b,0);
      cartButtons.forEach(button => {
        button.setAttribute('data-quantity', totalQty);
      });
    }

    // Update cart counter when page loads
    updateCartCounter();

    function addToCart() {
      // Check if book is out of stock
      const outOfStockBooks = ['la_yumkinuka_iidhaayi', 'the_hunger_games'];
      if (outOfStockBooks.includes(id)) {
        alert('This book is currently out of stock / هذا الكتاب نفدت الكمية حالياً');
        return;
      }
      
      const stored = JSON.parse(localStorage.getItem('cart')) || {};
      if (Array.isArray(stored)) {
        // migrate old array cart -> object with quantities
        const obj = {};
        stored.forEach(b => { obj[b] = (obj[b] || 0) + 1; });
        obj[id] = (obj[id] || 0) + 1;
        localStorage.setItem('cart', JSON.stringify(obj));
      } else {
        stored[id] = (stored[id] || 0) + 1;
        localStorage.setItem('cart', JSON.stringify(stored));
      }
      updateCartCounter();
      alert('Book added to cart successfully!');
    }
