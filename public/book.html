  <style>
    .button {
      height: 60px;
      width: 200px;
      background-color: #132233;
      border: 2px solid rgb(182, 128, 128);
      color: #eee;
      transition: .6s;
      font-size: 15px;
      border-radius: 50px;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .button span {
      transform: translateX(10px);
      transition: .5s;
    }

    .button svg {
      transform: translateX(-300px);
      transition: .6s;
      z-index: 3;
      height: 20px;
    }

    .button:hover {
      width: 60px;
      background-color: rgba(51, 34, 51, 0.815);
      box-shadow: 20px 20px 96px #bebebe, -20px -20px 96px #ffffff;
    }

    .button:hover svg {
      transform: translateX(-5px);
    }

    .button:hover span {
      transform: translateY(70px);
      font-size: .1rem;
    }

    /* Cart Icon Styles */
    .btn-cart {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 50px;
      height: 50px;
      border-radius: 10px;
      border: none;
      background-color: transparent;
      position: relative;
      cursor: pointer;
    }

    .btn-cart::after {
      content: attr(data-quantity);
      width: fit-content;
      height: fit-content;
      position: absolute;
      font-size: 15px;
      color: white;
      font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
      opacity: 0;
      visibility: hidden;
      transition: .2s linear;
      top: 115%;
    }

    .icon-cart {
      width: 24.38px;
      height: 30.52px;
      transition: .2s linear;
    }

    .icon-cart path {
      fill: rgb(240, 8, 8);
      transition: .2s linear;
    }

    .btn-cart:hover > .icon-cart {
      transform: scale(1.2);
    }

    .btn-cart:hover > .icon-cart path {
      fill: rgb(186, 34, 233);
    }

    .btn-cart:hover::after {
      visibility: visible;
      opacity: 1;
      top: 105%;
    }

    .quantity {
      display: none;
    }
  </style>
</head>

    // Debug: Log total books count
    console.log('Total books loaded:', Object.keys(books).length);

    const params = new URLSearchParams(window.location.search);
    const id = params.get("id");
    
    // Debug: Log the book ID being requested
    console.log('Requested book ID:', id);
    
    if (!id) {
      // If no ID provided, show error message but keep the page structure
      const titleEl = document.getElementById("book-title");
      const authorEl = document.getElementById("book-author");
      const priceEl = document.getElementById("book-price");
      const descEl = document.getElementById("book-description");
      if (titleEl) titleEl.textContent = "Error: No book ID provided";
      if (authorEl) authorEl.textContent = "";
      if (priceEl) priceEl.textContent = "";
      if (descEl) descEl.textContent = "Please select a book from the homepage.";
      return;
    }
    
    const book = books[id];
    
    // Debug: Log if book was found
    if (book) {
      console.log('Book found:', book.title);
    } else {
      console.warn('Book not found for ID:', id);
      console.log('Available book IDs:', Object.keys(books).slice(0, 10), '...');
    }

    if (book) {
      try {
        const titleEl = document.getElementById("book-title");
        const authorEl = document.getElementById("book-author");
        const priceEl = document.getElementById("book-price");
        const descEl = document.getElementById("book-description");
        const imageEl = document.getElementById("book-image");
        
        if (titleEl) titleEl.textContent = book.title || "Unknown Title";
        if (authorEl) authorEl.textContent = "Author: " + (book.author || "Unknown Author");
        
        // Display price
        if (priceEl) {
          if (book.price) {
            priceEl.textContent = "Price: " + book.price + " DZD";
          } else {
            priceEl.textContent = "";
          }
        }
        
        // Show Arabic description if language is 'ar', otherwise show English
        const lang = localStorage.getItem('lang') || 'en';
        if (descEl) {
          descEl.textContent = (lang === 'ar' && book.description_ar) ? book.description_ar : (book.description || "No description available.");
        }
        
        if (imageEl) {
          imageEl.src = book.cover || "";
          imageEl.onerror = function() {
            this.src = 'https://placehold.co/300x400/ccc/666?text=Cover+Not+Available';
          };
        }
        
        // Check if book is out of stock and update UI accordingly
        if (book.inStock === false) {
          const button = document.querySelector('.button');
          if (button) {
            button.disabled = true;
            button.style.backgroundColor = '#dc2626';
            button.style.cursor = 'not-allowed';
            button.style.opacity = '0.7';
            button.innerHTML = '<span>Out of Stock / نفدت الكمية</span>';
            
            // Add out of stock notice
            const notice = document.createElement('p');
            notice.style.color = '#dc2626';
            notice.style.fontWeight = 'bold';
            notice.style.textAlign = 'center';
            notice.style.margin = '10px 0';
            notice.textContent = 'This book is currently out of stock / هذا الكتاب نفدت الكمية حالياً';
            button.parentNode.insertBefore(notice, button);
          }
        }
      } catch (error) {
        console.error("Error loading book:", error);
        const titleEl = document.getElementById("book-title");
        if (titleEl) titleEl.textContent = "Error loading book details";
      }
    } else {
      // Book not found - show error but keep page structure
      const titleEl = document.getElementById("book-title");
      const authorEl = document.getElementById("book-author");
      const priceEl = document.getElementById("book-price");
      const descEl = document.getElementById("book-description");
      const button = document.querySelector('.button');
      
      if (titleEl) titleEl.textContent = "Book Not Found";
      if (authorEl) authorEl.textContent = "";
      if (priceEl) priceEl.textContent = "";
      if (descEl) descEl.textContent = "Sorry, the book you're looking for could not be found. Please return to the homepage and try again.";
      if (button) {
        button.innerHTML = '<span>Go to Homepage</span>';
        button.onclick = function() { window.location.href = 'index.html'; };
      }
      
      // Add a link to go back
      const backLink = document.createElement('a');
      backLink.href = 'index.html';
      backLink.textContent = '← Back to Homepage';
      backLink.className = 'text-blue-600 hover:text-blue-800 underline text-center block mt-4';
      const container = document.querySelector('.max-w-md');
      if (container) {
        container.appendChild(backLink);
      }
    }

    // Update cart counter on page load
    function updateCartCounter() {
      try {
        const cartData = localStorage.getItem('cart');
        const stored = cartData ? JSON.parse(cartData) : {};
        const cartButtons = document.querySelectorAll('.btn-cart');
        const totalQty = Array.isArray(stored) ? stored.length : Object.values(stored).reduce((a,b)=>a+b,0);
        cartButtons.forEach(button => {
          if (button) {
            button.setAttribute('data-quantity', totalQty);
          }
        });
      } catch (error) {
        console.error("Error updating cart counter:", error);
        // Set default value if error
        const cartButtons = document.querySelectorAll('.btn-cart');
        cartButtons.forEach(button => {
          if (button) {
            button.setAttribute('data-quantity', '0');
          }
        });
      }
    }

    // Update cart counter when page loads
    updateCartCounter();

    function addToCart() {
      try {
        const params = new URLSearchParams(window.location.search);
        const bookId = params.get("id");
        
        if (!bookId) {
          alert('Error: No book ID found. Please try again.');
          return;
        }
        
        const currentBook = books[bookId];
        if (!currentBook) {
          alert('Error: Book not found. Please try again.');
          return;
        }
        
        // Check if book is out of stock
        if (currentBook.inStock === false) {
          const lang = localStorage.getItem('lang') || 'en';
          alert(lang === 'ar' ? 'هذا الكتاب نفدت الكمية حالياً' : 'This book is currently out of stock');
          return;
        }
        
        const stored = JSON.parse(localStorage.getItem('cart') || '{}');
        if (Array.isArray(stored)) {
          // migrate old array cart -> object with quantities
          const obj = {};
          stored.forEach(b => { obj[b] = (obj[b] || 0) + 1; });
          obj[bookId] = (obj[bookId] || 0) + 1;
          localStorage.setItem('cart', JSON.stringify(obj));
        } else {
          stored[bookId] = (stored[bookId] || 0) + 1;
          localStorage.setItem('cart', JSON.stringify(stored));
        }
        updateCartCounter();
        
        const lang = localStorage.getItem('lang') || 'en';
        alert(lang === 'ar' ? 'تم إضافة الكتاب إلى السلة بنجاح!' : 'Book added to cart successfully!');
      } catch (error) {
        console.error("Error adding to cart:", error);
        alert('An error occurred while adding the book to cart. Please try again.');
      }
    }
    
    // Make addToCart available globally
    window.addToCart = addToCart;
      } catch (error) {
        console.error("Fatal error in book.html:", error);
        // Show user-friendly error message
        const titleEl = document.getElementById("book-title");
        if (titleEl) {
          titleEl.textContent = "Error Loading Page";
          const descEl = document.getElementById("book-description");
          if (descEl) {
            descEl.textContent = "An error occurred while loading this page. Please try refreshing or return to the homepage.";
          }
        }
      }
    });
  </script>
