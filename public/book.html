<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ChapterOne Bookstore - Book</title>
  <script src="config.js"></script>
  <link rel="stylesheet" href="index.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet" />
  <style>
    .button {
      height: 60px;
      width: 200px;
      background-color: #132233;
      border: 2px solid rgb(182, 128, 128);
      color: #eee;
      transition: .6s;
      font-size: 15px;
      border-radius: 50px;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .button span {
      transform: translateX(10px);
      transition: .5s;
    }

    .button svg {
      transform: translateX(-300px);
      transition: .6s;
      z-index: 3;
      height: 20px;
    }

    .button:hover {
      width: 60px;
      background-color: rgba(51, 34, 51, 0.815);
      box-shadow: 20px 20px 96px #bebebe, -20px -20px 96px #ffffff;
    }

    .button:hover svg {
      transform: translateX(-5px);
    }

    .button:hover span {
      transform: translateY(70px);
      font-size: .1rem;
    }

    /* Cart Icon Styles */
    .btn-cart {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 50px;
      height: 50px;
      border-radius: 10px;
      border: none;
      background-color: transparent;
      position: relative;
      cursor: pointer;
    }

    .btn-cart::after {
      content: attr(data-quantity);
      width: fit-content;
      height: fit-content;
      position: absolute;
      font-size: 15px;
      color: white;
      font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
      opacity: 0;
      visibility: hidden;
      transition: .2s linear;
      top: 115%;
    }

    .icon-cart {
      width: 24.38px;
      height: 30.52px;
      transition: .2s linear;
    }

    .icon-cart path {
      fill: rgb(240, 8, 8);
      transition: .2s linear;
    }

    .btn-cart:hover>.icon-cart {
      transform: scale(1.2);
    }

    .btn-cart:hover>.icon-cart path {
      fill: rgb(186, 34, 233);
    }

    .btn-cart:hover::after {
      visibility: visible;
      opacity: 1;
      top: 105%;
    }

    .quantity {
      display: none;
    }
  </style>
</head>

<body class="bg-[#FCF8D5] text-[#5E2217] font-inter min-h-screen flex items-center justify-center p-6">
  <!-- Cart Icon -->
  <div class="fixed top-4 right-4 z-50">
    <button data-quantity="0" class="btn-cart" onclick="window.location.href='cart.html'">
      <svg class="icon-cart" viewBox="0 0 24.38 30.52" height="30.52" width="24.38" xmlns="http://www.w3.org/2000/svg">
        <title>icon-cart</title>
        <path transform="translate(-3.62 -0.85)"
          d="M28,27.3,26.24,7.51a.75.75,0,0,0-.76-.69h-3.7a6,6,0,0,0-12,0H6.13a.76.76,0,0,0-.76.69L3.62,27.3v.07a4.29,4.29,0,0,0,4.52,4H23.48a4.29,4.29,0,0,0,4.52-4ZM15.81,2.37a4.47,4.47,0,0,1,4.46,4.45H11.35a4.47,4.47,0,0,1,4.46-4.45Zm7.67,27.48H8.13a2.79,2.79,0,0,1-3-2.45L6.83,8.34h3V11a.76.76,0,0,0,1.52,0V8.34h8.92V11a.76.76,0,0,0,1.52,0V8.34h3L26.48,27.4a2.79,2.79,0,0,1-3,2.44Zm0,0">
        </path>
      </svg>
      <span class="quantity"></span>
    </button>
  </div>

  <div class="max-w-md w-full bg-white shadow-lg rounded-lg p-6 mx-auto">
    <img id="book-image" src="" class="mb-4 rounded w-full max-w-xs mx-auto" />
    <h1 id="book-title" class="text-3xl font-bold text-center mb-2"></h1>
    <p id="book-author" class="text-center text-gray-700 mb-4"></p>
    <p id="book-price" class="text-center text-xl font-bold text-red-600 mb-4"></p>
    <p id="book-description" class="text-justify text-gray-800 mb-6"></p>
    <div class="flex justify-center">
      <button class="button" onclick="addToCart()">
        <span>Add to cart</span>
        <svg fill="#fff" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
          <g>
            <g>
              <g>
                <g id="cart">
                  <circle r="1.91" cy="20.59" cx="10.07"></circle>
                  <circle r="1.91" cy="20.59" cx="18.66"></circle>
                  <path
                    d="M.52,1.5H3.18a2.87,2.87,0,0,1,2.74,2L9.11,13.91H8.64A2.39,2.39,0,0,0,6.25,16.3h0a2.39,2.39,0,0,0,2.39,2.38h10">
                  </path>
                  <polyline points="7.21 5.32 22.48 5.32 22.48 7.23 20.57 13.91 9.11 13.91"></polyline>
                </g>
              </g>
            </g>
          </g>
        </svg>
      </button>
    </div>
  </div>

  <script>
    // Wait for DOM to be fully loaded before executing
    document.addEventListener('DOMContentLoaded', function () {
      try {
        let books = {};

        // Merge CMS books from cms-books.json, then process the book page
        fetch('cms-books.json')
          .then(function (res) {
            if (!res.ok) return null;
            return res.json();
          })
          .then(function (cmsBooks) {
            if (Array.isArray(cmsBooks)) {
              cmsBooks.forEach(function (b) {
                const id = 'cms_' + (b.slug || b.title || '');
                if (!id.trim()) return;
                // Normalize into the same shape as hardcoded books
                books[id] = {
                  title: b.title || '',
                  author: b.author || '',
                  description: b.description || '',
                  description_ar: b.description || '',
                  cover: b.image || '',
                  price: b.price ? String(b.price) : '',
                  isbn: b.isbn || '',
                  inStock: (b.status || 'available').toLowerCase() !== 'out of stock'
                };
              });
            }
          })
          .catch(function (err) {
            console.error('Error loading CMS books for book page:', err);
          })
          .finally(function () {
            processBookPage();
          });
        
        function processBookPage() {
        const params = new URLSearchParams(window.location.search);
        const id = params.get("id");

        // Debug: Log the book ID being requested
        console.log('Requested book ID:', id);

        if (!id) {
          // If no ID provided, show error message but keep the page structure
          const titleEl = document.getElementById("book-title");
          const authorEl = document.getElementById("book-author");
          const priceEl = document.getElementById("book-price");
          const descEl = document.getElementById("book-description");
          if (titleEl) titleEl.textContent = "Error: No book ID provided";
          if (authorEl) authorEl.textContent = "";
          if (priceEl) priceEl.textContent = "";
          if (descEl) descEl.textContent = "Please select a book from the homepage.";
          return;
        }

        const book = books[id];

        // Debug: Log if book was found
        if (book) {
          console.log('Book found:', book.title);
        } else {
          console.warn('Book not found for ID:', id);
          console.log('Available book IDs:', Object.keys(books).slice(0, 10), '...');
        }

        if (book) {
          try {
            const titleEl = document.getElementById("book-title");
            const authorEl = document.getElementById("book-author");
            const priceEl = document.getElementById("book-price");
            const descEl = document.getElementById("book-description");
            const imageEl = document.getElementById("book-image");

            if (titleEl) titleEl.textContent = book.title || "Unknown Title";
            if (authorEl) authorEl.textContent = "Author: " + (book.author || "Unknown Author");

            // Display price
            if (priceEl) {
              if (book.price) {
                priceEl.textContent = "Price: " + book.price + " DZD";
              } else {
                priceEl.textContent = "";
              }
            }

            // Show Arabic description if language is 'ar', otherwise show English
            const lang = localStorage.getItem('lang') || 'en';
            if (descEl) {
              descEl.textContent = (lang === 'ar' && book.description_ar) ? book.description_ar : (book.description || "No description available.");
            }

            if (imageEl) {
              imageEl.src = book.cover || "";
              imageEl.onerror = function () {
                this.src = 'https://placehold.co/300x400/ccc/666?text=Cover+Not+Available';
              };
            }

            // Check if book is out of stock and update UI accordingly
            if (book.inStock === false) {
              const button = document.querySelector('.button');
              if (button) {
                button.disabled = true;
                button.style.backgroundColor = '#dc2626';
                button.style.cursor = 'not-allowed';
                button.style.opacity = '0.7';
                button.innerHTML = '<span>Out of Stock / نفدت الكمية</span>';

                // Add out of stock notice
                const notice = document.createElement('p');
                notice.style.color = '#dc2626';
                notice.style.fontWeight = 'bold';
                notice.style.textAlign = 'center';
                notice.style.margin = '10px 0';
                notice.textContent = 'This book is currently out of stock / هذا الكتاب نفدت الكمية حالياً';
                button.parentNode.insertBefore(notice, button);
              }
            }
          } catch (error) {
            console.error("Error loading book:", error);
            const titleEl = document.getElementById("book-title");
            if (titleEl) titleEl.textContent = "Error loading book details";
          }
        } else {
          // Book not found - show error but keep page structure
          const titleEl = document.getElementById("book-title");
          const authorEl = document.getElementById("book-author");
          const priceEl = document.getElementById("book-price");
          const descEl = document.getElementById("book-description");
          const button = document.querySelector('.button');
          const isCmsId = id && id.startsWith('cms_');

          if (titleEl) titleEl.textContent = "Book Not Found";
          if (authorEl) authorEl.textContent = "";
          if (priceEl) priceEl.textContent = "";
          if (descEl) descEl.textContent = "Sorry, the book you're looking for could not be found. Please return to the homepage and try again.";

          // For CMS IDs, keep the Add to Cart button as-is so it doesn't redirect.
          // For non-CMS invalid IDs, turn the button into a 'Go to Homepage' button.
          if (button && !isCmsId) {
            button.innerHTML = '<span>Go to Homepage</span>';
            button.onclick = function () { window.location.href = 'index.html'; };
          }

          // Add a link to go back only for non-CMS invalid IDs
          if (!isCmsId) {
            const backLink = document.createElement('a');
            backLink.href = 'index.html';
            backLink.textContent = '← Back to Homepage';
            backLink.className = 'text-blue-600 hover:text-blue-800 underline text-center block mt-4';
            const container = document.querySelector('.max-w-md');
            if (container) {
              container.appendChild(backLink);
            }
          }
        }

        // Update cart counter on page load
        function updateCartCounter() {
          try {
            const cartData = localStorage.getItem('cart');
            const stored = cartData ? JSON.parse(cartData) : {};
            const cartButtons = document.querySelectorAll('.btn-cart');
            const totalQty = Array.isArray(stored) ? stored.length : Object.values(stored).reduce((a, b) => a + b, 0);
            cartButtons.forEach(button => {
              if (button) {
                button.setAttribute('data-quantity', totalQty);
              }
            });
          } catch (error) {
            console.error("Error updating cart counter:", error);
            // Set default value if error
            const cartButtons = document.querySelectorAll('.btn-cart');
            cartButtons.forEach(button => {
              if (button) {
                button.setAttribute('data-quantity', '0');
              }
            });
          }
        }

        // Update cart counter when page loads
        updateCartCounter();
        }
        
        // Always run processBookPage — all books are now CMS-based
        processBookPage();

        function addToCart() {
          try {
            const params = new URLSearchParams(window.location.search);
            const bookId = params.get("id");

            if (!bookId) {
              alert('Error: No book ID found. Please try again.');
              return;
            }

            const currentBook = books[bookId];
            if (!currentBook) {
              alert('Error: Book not found. Please try again.');
              return;
            }

            // Check if book is out of stock
            if (currentBook.inStock === false) {
              const lang = localStorage.getItem('lang') || 'en';
              alert(lang === 'ar' ? 'هذا الكتاب نفدت الكمية حالياً' : 'This book is currently out of stock');
              return;
            }

            // Safely parse cart (it might be corrupted / old format)
            const raw = localStorage.getItem('cart');
            let stored;
            try {
              stored = raw ? JSON.parse(raw) : {};
            } catch (e) {
              console.warn('Invalid cart in localStorage, resetting.', e);
              stored = {};
            }

            if (Array.isArray(stored)) {
              // migrate old array cart -> object with quantities
              const obj = {};
              stored.forEach(b => { obj[b] = (obj[b] || 0) + 1; });
              obj[bookId] = (obj[bookId] || 0) + 1;
              localStorage.setItem('cart', JSON.stringify(obj));
            } else {
              if (!stored || typeof stored !== 'object') stored = {};
              stored[bookId] = (stored[bookId] || 0) + 1;
              localStorage.setItem('cart', JSON.stringify(stored));
            }

            if (typeof updateCartCounter === 'function') {
              updateCartCounter();
            }

            const lang = localStorage.getItem('lang') || 'en';
            alert(lang === 'ar' ? 'تم إضافة الكتاب إلى السلة بنجاح!' : 'Book added to cart successfully!');
          } catch (error) {
            console.error("Error adding to cart:", error);
            alert('An error occurred while adding the book to cart. Please try again.');
          }
        }

        // Make addToCart available globally
        window.addToCart = addToCart;
      } catch (error) {
        console.error("Fatal error in book.html:", error);
        // Show user-friendly error message
        const titleEl = document.getElementById("book-title");
        if (titleEl) {
          titleEl.textContent = "Error Loading Page";
          const descEl = document.getElementById("book-description");
          if (descEl) {
            descEl.textContent = "An error occurred while loading this page. Please try refreshing or return to the homepage.";
          }
        }
      }
    });
  </script>
</body>

</html>
