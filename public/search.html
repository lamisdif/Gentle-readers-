    body {
      background: #FCF8D5;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      color: #5E2217;
      margin: 0;
      padding: 0;
    }
    .search-page-wrapper {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      background: #fcf8d5;
    }
    .search-bar-container {
      width: 100%;
      max-width: 600px;
      margin: 40px auto 0 auto;
      padding: 0 24px 12px 24px;
      display: flex;
      justify-content: center;
      background: #fffbe9;
      border-radius: 18px 18px 0 0;
      box-shadow: 0 4px 32px rgba(60,30,10,0.04);
    }
    .search-results-container {
      width: 100%;
      max-width: 900px;
      margin: 0 auto 40px auto;
      padding: 32px 24px 40px 24px;
      background: #fffbe9;
      border-radius: 0 0 18px 18px;
      box-shadow: 0 4px 32px rgba(60,30,10,0.08);
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .results-header {
      font-size: 2.2rem;
      font-weight: 800;
      margin-bottom: 32px;
      text-align: center;
      color: #5e2217;
    }
    .results-list {
      display: flex;
      flex-wrap: wrap;
      gap: 32px;
      justify-content: center;
      width: 100%;
      margin-top: 16px;
    }
    .flip-book-card-wrapper {
      width: 240px;
      min-height: 340px;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 2px 12px rgba(60,30,10,0.07);
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 18px 12px 24px 12px;
      transition: box-shadow 0.2s, transform 0.2s;
      cursor: pointer;
      position: relative;
    }
    .flip-book-card-wrapper:hover {
      box-shadow: 0 8px 32px rgba(60,30,10,0.13);
      transform: translateY(-6px) scale(1.03);
    }
    .flip-book-card-front {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .book-cover-image {
      width: 180px;
      height: 240px;
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 18px;
      box-shadow: 0 2px 8px rgba(60,30,10,0.10);
      background: #f8f8f8;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .book-cover-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 10px;
    }
    .book-title {
      font-size: 1.2rem;
      font-weight: 700;
      color: #5e2217;
      margin-bottom: 4px;
      text-align: center;
    }
    .book-author {
      font-size: 1rem;
      color: #c4a484;
      margin-bottom: 10px;
      text-align: center;
    }
    .summary-text {
      color: #5e2217;
      font-size: 0.98rem;
      margin-top: 10px;
      text-align: center;
    }
    .no-results {
      text-align: center;
      font-size: 1.2rem;
      color: #b94a48;
      margin: 48px 0;
      width: 100%;
    }
    .back-btn {
      display: inline-block;
      margin: 0 auto 32px auto;
      background: #5E2217;
      color: #fff;
      padding: 10px 24px;
      border-radius: 8px;
      font-weight: 600;
      text-decoration: none;
      transition: background 0.2s;
    }
    .back-btn:hover {
      background: #4a1a14;
    }
    .book-card {
      background: #5E2217;
      color: #fff;
      border-radius: 20px;
      padding: 32px 24px;

      border: none;
      /* Remove any parent white background if present */
    }

      font-weight: 400;
      line-height: 1.4;
      color: #fcf8d5;
      text-align: left;
      margin-bottom: 15px;
    }

      font-family: 'Inter', sans-serif !important;
      font-weight: 400 !important;
      font-size: 0.85em !important;
      line-height: 1.4 !important;
      color: #fcf8d5 !important;
      text-align: left !important;
      margin-bottom: 15px !important;
      -webkit-font-smoothing: antialiased !important;
      -moz-osx-font-smoothing: grayscale !important;
    }
    @media (max-width: 700px) {
      .search-bar-container, .search-results-container {
        max-width: 98vw;
        padding: 12px 4vw;
      }
      .flip-book-card-wrapper {
        width: 98vw;
        min-width: 0;
        max-width: 340px;
      }
      .book-cover-image {
        width: 90vw;
        max-width: 180px;
        height: 220px;
      }
    }
  </style>
</head>

      al_mithl_wa_qissa_aleima: { title: "المثل وقصة أليمة", author: "فيودور دوستويفسكي", description: "The Idiot and a Painful Story combines two of Dostoevsky's works, exploring themes of innocence, suffering, and the human condition. The stories examine how pure hearts navigate a world filled with pain and complexity.", cover: "imgs/غلاف-المثل.jpg", price: "1,700.00", isbn: "9789776543264" },
      qaryat_stibanchikogo: { title: "قرية ستيبانتشيكوفو", author: "فيودور دوستويفسكي", description: "The Village of Stepanchikovo and Its Inhabitants is a satirical novel about a small Russian village and its eccentric residents. The story humorously explores social dynamics, hypocrisy, and the absurdities of rural Russian life.", cover: "imgs/غلاف-قرية-ستيبانتشيكوفو.jpg", price: "1,700.00", isbn: "9789776543265" },
      madhlun_mahzun: { title: "مذلون مهانون", author: "فيودور دوستويفسكي", description: "Humiliated and Insulted is a novel about a young writer who becomes involved with a family torn apart by social injustice. The story explores themes of love, sacrifice, and the suffering of the innocent in a corrupt society.", cover: "imgs/مذلون-مهانون-.jpg", price: "2,500.00", isbn: "9789776543267" },
      al_batal_al_saghir: { title: "البطل الصغير", author: "فيودور دوستويفسكي", description: "The Little Hero is a short story by Dostoevsky that explores themes of childhood, innocence, and heroism in a small world. The story follows a young protagonist who discovers courage and meaning in everyday life.", cover: "imgs/البطل الصغير.jpg", price: "1,200.00", isbn: "9789776543268" }
    };
    const allBooks = Object.entries(books).map(([id, book]) => ({
      id,
      title: book.title,
      author: book.author,
      cover: book.cover,
      summary: book.description || book.summary || '',
      price: book.price || '',
      isbn: book.isbn || '',
      genre: book.genre || 'general' // Ensure genre is present
    }));
    // --- Search Bar Logic ---
    const searchForm = document.getElementById('searchForm');
    const searchInput = document.getElementById('searchInput');
    // If a previous search exists, show it in the input
    if (searchInput && localStorage.getItem('searchQuery')) {
      searchInput.value = localStorage.getItem('searchQuery');
    }
    if (searchForm) {
      searchForm.addEventListener('submit', function(e) {
        e.preventDefault();
        const query = searchInput.value.trim();
        localStorage.setItem('searchQuery', query);
        window.location.reload();
      });
    }
    // Get search query from localStorage
    function normalizeArabic(text) {
      return (text || '')
        .toLowerCase()
        .replace(/[\u064B-\u0652]/g, '') // remove diacritics
        .replace(/[إأآٱ]/g, 'ا')
        .replace(/ى/g, 'ي')
        .replace(/ؤ/g, 'و')
        .replace(/ئ/g, 'ي')
        .replace(/ة/g, 'ه');
    }
    const rawQuery = (localStorage.getItem('searchQuery') || '').trim();
    const query = normalizeArabic(rawQuery);
    const resultsHeader = document.getElementById('resultsHeader');
    const resultsList = document.getElementById('resultsList');
    if (!query) {
      resultsHeader.textContent = 'No search query provided.';
      resultsList.innerHTML = '';
    } else {
      const filtered = allBooks.filter(book => {
        const t = normalizeArabic(book.title);
        const a = normalizeArabic(book.author);
        const g = normalizeArabic(book.genre);
        return t.includes(query) || a.includes(query) || g.includes(query);
      });
      if (filtered.length === 0) {
        resultsHeader.textContent = 'No results found.';
        resultsList.innerHTML = '<div class="no-results">No books match your search.<br><span style="font-size:2.5rem;">📚</span></div>';
      } else {
        resultsHeader.textContent = `Results for "${rawQuery}"`;
        resultsList.innerHTML = '';
        filtered.forEach(book => {
          const outOfStockBooks = ['la_yumkinuka_iidhaayi', 'the_hunger_games'];
          const isOutOfStock = outOfStockBooks.includes(book.id);
          const buttonStyle = isOutOfStock 
            ? "position: absolute; top: 8px; right: 8px; background: rgba(220,38,38,0.9); border: none; border-radius: 50%; width: 25px; height: 25px; cursor: not-allowed; display: flex; align-items: center; justify-content: center; z-index: 200; opacity: 0.7;"
            : "position: absolute; top: 8px; right: 8px; background: rgba(255,255,255,0.9); border: none; border-radius: 50%; width: 25px; height: 25px; cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 200;";
          const buttonTitle = isOutOfStock ? 'title="Out of Stock / نفدت الكمية"' : '';
          const buttonDisabled = isOutOfStock ? 'disabled' : '';
          
          resultsList.innerHTML += `
            <div class="item" style="--position: 1">
              <div class="card" onclick="openBook('${book.id}')" style="cursor: pointer; position: relative; z-index: 100;">
                <button class="add-to-cart-btn" onclick="addToCartFromCard('${book.id}', event)" style="${buttonStyle}" ${buttonTitle} ${buttonDisabled}>
                  <svg class="icon-cart" viewBox="0 0 24.38 30.52" height="15" width="15" xmlns="http://www.w3.org/2000/svg">
                    <title>icon-cart</title>
                    <path transform="translate(-3.62 -0.85)" d="M28,27.3,26.24,7.51a.75.75,0,0,0-.76-.69h-3.7a6,6,0,0,0-12,0H6.13a.76.76,0,0,0-.76.69L3.62,27.3v.07a4.29,4.29,0,0,0,4.52,4H23.48a4.29,4.29,0,0,0,4.52-4ZM15.81,2.37a4.47,4.47,0,0,1,4.46,4.45H11.35a4.47,4.47,0,0,1,4.46-4.45Zm7.67,27.48H8.13a2.79,2.79,0,0,1-3-2.45L6.83,8.34h3V11a.76.76,0,0,0,1.52,0V8.34h8.92V11a.76.76,0,0,0,1.52,0V8.34h3L26.48,27.4a2.79,2.79,0,0,1-3,2.44Zm0,0"></path>
                  </svg>
                </button>
                <div class="flip-book-card-wrapper" onclick="openBook('${book.id}')" style="cursor: pointer;">
                  <div class="flip-book-card-content" onclick="openBook('${book.id}')" style="cursor: pointer;">
                    <div class="flip-book-card-front" onclick="openBook('${book.id}')" style="cursor: pointer;">
                      <div class="book-cover-image">
                        <img src="${book.cover}" alt="Book Cover" onerror="this.onerror=null; this.src='https://placehold.co/200x280/ccc/666?text=Cover+Image+Unavailable'" />
                        <span>Cover Image Unavailable</span>
                      </div>
                      <p class="book-title">${book.title}</p>
                      <p class="book-author">${book.author}</p>
                      ${isOutOfStock ? '<p class="out-of-stock-notice" style="color: #dc2626; font-weight: bold; font-size: 14px; margin: 5px 0; text-align: center;">Out of Stock / نفدت الكمية</p>' : ''}
                      <p class="book-price">${book.price ? 'Price: ' + book.price : ''}</p>
                    </div>
                    <div class="flip-book-card-back">
                      <div class="flip-book-card-back-content">
                        <h4 class="text-lg font-bold mb-2">Book Summary</h4>
                        <p class="summary-text">${book.summary ? book.summary : ''}</p>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          `;
        });
      }
    }
    // Improved openBook function for navigation
    function openBook(id) {
      window.location.href = `book.html?id=${id}`;
    }
    // Add the addToCartFromCard function from index.html for full functionality
    function addToCartFromCard(bookId, event) {
      event.stopPropagation();
      
      // Check if book is out of stock
      const outOfStockBooks = ['la_yumkinuka_iidhaayi', 'the_hunger_games'];
      if (outOfStockBooks.includes(bookId)) {
        alert('This book is currently out of stock / هذا الكتاب نفدت الكمية حالياً');
        return;
      }
      
      const stored = JSON.parse(localStorage.getItem('cart')) || {};
      if (Array.isArray(stored)) {
        const obj = {};
        stored.forEach(id => { obj[id] = (obj[id] || 0) + 1; });
        obj[bookId] = (obj[bookId] || 0) + 1;
        localStorage.setItem('cart', JSON.stringify(obj));
      } else {
        stored[bookId] = (stored[bookId] || 0) + 1;
        localStorage.setItem('cart', JSON.stringify(stored));
      }
      updateCartCounter();
      const navCartIcon = document.querySelector('.btn-cart');
      if (navCartIcon) {
        navCartIcon.style.transform = 'scale(1.2)';
        navCartIcon.style.transition = 'transform 0.3s ease';
        setTimeout(() => {
          navCartIcon.style.transform = 'scale(1)';
        }, 300);
      }
    }
    // Add updateCartCounter for cart icon
    function updateCartCounter() {
      const stored = JSON.parse(localStorage.getItem('cart')) || {};
      const cartButtons = document.querySelectorAll('.btn-cart');
      const totalQty = Array.isArray(stored) ? stored.length : Object.values(stored).reduce((a,b)=>a+b,0);
      cartButtons.forEach(button => {
        button.setAttribute('data-quantity', totalQty);
      });
    }
    document.addEventListener('DOMContentLoaded', function() {
      updateCartCounter();
    });
  </script>
</body>
