<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Orders</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module">
        import { createClient } from 'https://cdn.skypack.dev/@supabase/supabase-js';
        
        // Password protection
        const pswd = prompt("Enter Admin Password:");
        if (pswd !== "gentleadmin") {
            document.body.innerHTML = "<div class='flex items-center justify-center min-h-screen bg-gray-100'><div class='bg-white p-8 rounded shadow-md text-center'><h1 class='text-red-600 text-3xl font-bold mb-4'>Access Denied</h1><p class='text-gray-600'>Incorrect password. Please refresh to try again.</p></div></div>";
            throw new Error("Access Denied");
        }

        const supabaseUrl = "https://fsximdllrhglabxbqvay.supabase.co";
        const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZzeGltZGxscmhnbGFieGJxdmF5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTY3NTg0NzgsImV4cCI6MjA3MjMzNDQ3OH0.KiRJdFoW4DtDAPMLqH9Im3-37GhIFmD269iDsY7ih2Q";
        const supabase = createClient(supabaseUrl, supabaseKey);

        let allOrders = [];

        function formatDate(dateStr) {
            if (!dateStr) return "-";
            const d = new Date(dateStr);
            return d.toLocaleDateString() + ' ' + d.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
        }

        function formatItems(itemsJson) {
            try {
                if (!itemsJson) return "-";
                let items;
                if (typeof itemsJson === 'string') {
                    items = JSON.parse(itemsJson);
                } else {
                    items = itemsJson;
                }

                if (Array.isArray(items)) {
                    return Object.entries(items).map(([id, qty]) => `${id} (x${qty})`).join('<br>');
                } else if (typeof items === 'object') {
                    return Object.entries(items).map(([id, qty]) => `${id} <span class="text-blue-600 font-bold">(x${qty})</span>`).join('<br>');
                }
                return String(itemsJson);
            } catch (e) {
                return String(itemsJson);
            }
        }

        async function loadOrders() {
            const tbody = document.getElementById("orders-tbody");
            tbody.innerHTML = "<tr><td colspan='17' class='p-8 text-center text-gray-500 font-medium'>Loading orders securely from database...</td></tr>";

            const { data, error } = await supabase
                .from('orders')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) {
                console.error("Error fetching orders:", error);
                tbody.innerHTML = `<tr><td colspan='17' class='p-8 text-center text-red-500 font-bold'>Error loading orders: ${error.message}</td></tr>`;
                return;
            }

            allOrders = data || [];
            renderTable(allOrders);
        }

        function renderTable(orders) {
            const tbody = document.getElementById("orders-tbody");
            if (orders.length === 0) {
                tbody.innerHTML = "<tr><td colspan='17' class='p-8 text-center text-gray-500 font-medium'>No orders found matching your criteria.</td></tr>";
                return;
            }

            tbody.innerHTML = orders.map((o, idx) => `
                <tr class="border-b transition duration-150 ease-in-out hover:bg-yellow-50 ${idx % 2 === 0 ? 'bg-white' : 'bg-gray-50'}">
                    <td class="p-3 text-xs font-mono text-gray-500">${o.id}</td>
                    <td class="p-3 text-sm whitespace-nowrap text-gray-700">${formatDate(o.created_at)}</td>
                    <td class="p-3 text-sm font-semibold capitalize">${o.firstName || '-'}</td>
                    <td class="p-3 text-sm font-semibold uppercase">${o.familyName || '-'}</td>
                    <td class="p-3 text-sm font-mono tracking-wider">${o.phoneNumber || '-'}</td>
                    <td class="p-3 text-sm text-pink-600 font-medium">@${o.instagramUsername || '-'}</td>
                    <td class="p-3 text-xs leading-relaxed max-w-xs overflow-auto bg-gray-50">${formatItems(o.items)}</td>
                    <td class="p-3 text-sm font-medium text-gray-700">${o.subtotal ? o.subtotal + ' DA' : '-'}</td>
                    <td class="p-3 text-sm text-gray-600">${o.shipping_price ? o.shipping_price + ' DA' : '-'}</td>
                    <td class="p-3 text-sm font-bold text-green-700">${o.total_price ? o.total_price + ' DA' : '-'}</td>
                    <td class="p-3 text-sm font-medium text-gray-800">${o.wilaya || '-'}</td>
                    <td class="p-3 text-sm text-gray-700">${o.daira || '-'}</td>
                    <td class="p-3 text-sm max-w-[200px] truncate text-gray-600" title="${o.address || ''}">${o.address || '-'}</td>
                    <td class="p-3 text-sm">
                        <span class="px-2 py-1 rounded text-xs font-bold ${o.deliveryMethod === 'desk' ? 'bg-blue-100 text-blue-800' : 'bg-indigo-100 text-indigo-800'}">
                            ${(o.deliveryMethod || '-').toUpperCase()}
                        </span>
                    </td>
                    <td class="p-3 text-sm ${o.desk ? 'font-medium text-blue-800' : 'text-gray-400'}">${o.desk || '-'}</td>
                    <td class="p-3 text-sm">
                        <span class="px-2 py-1 rounded text-xs font-semibold ${!o.packaging_type || o.packaging_type === 'none' ? 'bg-gray-100 text-gray-600' : 'bg-orange-100 text-orange-800'}">
                            ${o.packaging_type === 'none' ? 'NONE' : (o.packaging_type || 'NONE').toUpperCase()}
                        </span>
                    </td>
                    <td class="p-3 text-sm text-gray-600">${o.packaging_price ? o.packaging_price + ' DA' : '0 DA'}</td>
                </tr>
            `).join('');
            
            document.getElementById("order-count").innerHTML = `<span class="font-bold text-blue-600">${orders.length}</span> orders total`;
        }

        window.filterOrders = function() {
            const query = document.getElementById("search-input").value.toLowerCase();
            const filtered = allOrders.filter(o => {
                const searchStr = [
                    o.id, 
                    o.firstName, 
                    o.familyName, 
                    o.phoneNumber, 
                    o.instagramUsername
                ].join(" ").toLowerCase();
                
                return searchStr.includes(query);
            });
            renderTable(filtered);
        };

        // Initialize
        document.addEventListener('DOMContentLoaded', loadOrders);
    </script>
</head>
<body class="bg-gray-100 min-h-screen font-sans">
    
    <div class="max-w-full mx-auto p-4 sm:p-6 lg:p-8">
        <div class="sm:flex sm:items-center sm:justify-between mb-6 bg-white p-6 rounded-lg shadow-sm border border-gray-200">
            <div>
                <h1 class="text-3xl font-extrabold text-gray-900 tracking-tight">Orders Dashboard</h1>
                <p class="mt-2 text-sm text-gray-500" id="order-count">Loading orders...</p>
            </div>
            <div class="mt-4 sm:mt-0 relative">
                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                    <svg class="h-5 w-5 text-gray-400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                        <path fill-rule="evenodd" d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z" clip-rule="evenodd" />
                    </svg>
                </div>
                <input type="text" id="search-input" onkeyup="filterOrders()" placeholder="Search name, phone, or ID..." 
                    class="block w-full sm:text-sm text-gray-900 border-gray-300 rounded-lg shadow-sm pl-10 p-3 border focus:ring-2 focus:ring-blue-500 focus:border-blue-500 min-w-[300px] bg-gray-50" autocomplete="off">
            </div>
        </div>

        <div class="bg-white shadow-lg rounded-xl overflow-hidden border border-gray-200">
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200 table-auto">
                    <thead class="bg-slate-800 text-white">
                        <tr>
                            <th scope="col" class="p-4 text-left text-xs font-bold uppercase tracking-wider">ID</th>
                            <th scope="col" class="p-4 text-left text-xs font-bold uppercase tracking-wider">Date</th>
                            <th scope="col" class="p-4 text-left text-xs font-bold uppercase tracking-wider">First Name</th>
                            <th scope="col" class="p-4 text-left text-xs font-bold uppercase tracking-wider">Last Name</th>
                            <th scope="col" class="p-4 text-left text-xs font-bold uppercase tracking-wider">Phone</th>
                            <th scope="col" class="p-4 text-left text-xs font-bold uppercase tracking-wider">Insta</th>
                            <th scope="col" class="p-4 text-left text-xs font-bold uppercase tracking-wider">Items summary</th>
                            <th scope="col" class="p-4 text-left text-xs font-bold uppercase tracking-wider">Subtotal</th>
                            <th scope="col" class="p-4 text-left text-xs font-bold uppercase tracking-wider">Shipping</th>
                            <th scope="col" class="p-4 text-left text-xs font-bold uppercase tracking-wider">Total</th>
                            <th scope="col" class="p-4 text-left text-xs font-bold uppercase tracking-wider">Wilaya</th>
                            <th scope="col" class="p-4 text-left text-xs font-bold uppercase tracking-wider">Daira</th>
                            <th scope="col" class="p-4 text-left text-xs font-bold uppercase tracking-wider">Address</th>
                            <th scope="col" class="p-4 text-left text-xs font-bold uppercase tracking-wider">Method</th>
                            <th scope="col" class="p-4 text-left text-xs font-bold uppercase tracking-wider">Desk</th>
                            <th scope="col" class="p-4 text-left text-xs font-bold uppercase tracking-wider">Pkg Type</th>
                            <th scope="col" class="p-4 text-left text-xs font-bold uppercase tracking-wider">Pkg Price</th>
                        </tr>
                    </thead>
                    <tbody id="orders-tbody" class="bg-white divide-y divide-gray-200">
                        <!-- Rows -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</body>
</html>
