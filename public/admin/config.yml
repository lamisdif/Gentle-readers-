backend:
  name: github
  repo: lamisdif/Gentle-readers-   # Your GitHub repo
  branch: main

media_folder: "public/images/uploads"   # Where images are saved in the repo
public_folder: "/images/uploads"        # Public URL for images

collections:
  - name: "books"
    label: "Books"
    folder: "src/data/books"            # Each book is its own JSON file
    create: true
    format: "json"
    extension: "json"
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Author", name: "author", widget: "string" }
      - { label: "Price", name: "price", widget: "number", valueType: "int" }
      - label: "Status / الحالة"
        name: "status"
        widget: "select"
        options:
          - { label: "Available / متوفر", value: "available" }
          - { label: "Out of Stock / نفدت الكمية", value: "out of stock" }
        default: "available"
      - { label: "Description", name: "description", widget: "text" }
      - { label: "Image", name: "image", widget: "image", required: false }
      - { label: "Draft", name: "draft", widget: "boolean", default: false }

